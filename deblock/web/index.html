<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>deblock</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/backdrop.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="image-field" aria-hidden="true"><canvas id="field"></canvas></div>
  <aside class="distortion-control">
    <label for="distortion">distortion</label>
    <input id="distortion" type="range" min="0" max="100" value="65" aria-label="Distortion intensity">
  </aside>
  <main>
    <form id="word-form" autocomplete="off">
      <label for="word" class="sr-only">Next word or phrase</label>
      <div class="word-space" id="word-space">
        <span id="ghost-word" aria-hidden="true"></span>
        <span id="previous-word" aria-hidden="true"></span>
        <svg id="scribble" viewBox="0 0 600 100" preserveAspectRatio="none" aria-hidden="true"><path id="scribble-line"/></svg>
        <input id="word" type="text" placeholder="a word…" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="hint" disabled>
      </div>
      <p id="hint">type a word · enter · follow it</p>
      <button id="next" type="submit" aria-label="Next association" disabled>↵</button>
    </form>
  </main>
  <footer>
    <span class="signature">deblock</span>
    <span class="privacy">only in this tab</span>
    <nav aria-label="Writing controls">
      <button id="image-toggle" type="button" aria-label="Shuffle background colours">colours</button>
      <button id="motion" type="button" aria-pressed="true">motion on</button>
      <button id="about" type="button" aria-label="Exercise instructions and privacy">?</button>
      <button id="finish" type="button">done</button>
    </nav>
  </footer>
  <dialog id="info-dialog">
    <button class="close" type="button" aria-label="Close instructions">×</button>
    <h1 id="exercise-title">The Signifier Chain</h1>
    <p id="instructions">Loading instructions…</p>
    <p class="fine-print">Your words stay in this tab. They aren’t sent or saved. Download them before closing or refreshing.</p>
    <button id="retry" type="button" hidden>try again</button>
  </dialog>
  <dialog id="finish-dialog">
    <button class="close" type="button" aria-label="Return to writing">×</button>
    <h1>leave it here.</h1>
    <p id="chain-summary"></p>
    <div class="end-actions"><button id="resume" type="button">keep writing</button><button id="download" type="button">download ↓</button></div>
    <p class="fine-print">Only in this tab. Download before closing.</p>
  </dialog>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <noscript>This writing space needs JavaScript. Your writing stays in your browser.</noscript>
</body>
</html>
